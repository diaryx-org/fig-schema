[package]
name = "fig-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A generic, prov-agnostic schema layer over fig's value tree: field types, controlled vocabularies, and a reusable rule-matching engine."
readme = "README.md"
documentation = "https://docs.rs/fig-schema"
keywords = ["fig", "schema", "frontmatter", "validation", "vocabulary"]
categories = ["config", "data-structures", "parser-implementations", "command-line-utilities"]
publish = true

# A workspace of one package, kept for `[workspace.package]` below. CI is not a
# crate here: it is the jobs in .config/ship.figl, run by `ship ci`.
[workspace]

# One `version = "…"` line for the whole repository, which is what `ship bump`
# rewrites and what the package inherits. Keeping it here rather than in
# `[package]` is what lets the shared release tooling assert that exactly one
# such line exists.
[workspace.package]
version = "0.5.0"
edition = "2024"
# Minimum supported Rust version, enforced by the `msrv` CI job, which reads
# this value.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/diaryx-org/fig-schema"

# The command line, behind the default `cli` feature. fig 7 carries no
# language until a program brings one, so the binary depends on the five it
# names (and on twig, which finds the block inside a markdown file), while a
# library caller turns default features off and gets the schema layer over
# fig's value tree with nothing else. `cargo install fig-schema` still
# produces a working `fig-schema` with no flag to remember.
[[bin]]
name = "fig-schema"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:fig-json",
    "dep:fig-yaml",
    "dep:fig-toml",
    "dep:fig-zon",
    "dep:fig-figl",
    "dep:twig-doc",
    "dep:twig-markdown",
]

[dependencies]
# The library's one dependency: the schema document format is a fig document,
# and its values are fig's.
fig = "7"
# The command line's languages, each without serde.
fig-json = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-yaml = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-toml = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-zon = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-figl = { version = "7", default-features = false, features = ["fig"], optional = true }
# A markdown file's frontmatter or endmatter, located by twig (fig 6 took
# embedding out of fig).
twig-doc = { version = "7", optional = true }
twig-markdown = { version = "7", optional = true }

[dev-dependencies]
# The tests and doc examples parse YAML, TOML and figl.
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }
