# What the shared release tooling needs to know about fig-schema. Everything not
# stated here is a default in lib/repo.nu — the manifest, the changelog path, the
# cliff config, and that this is a Cargo workspace.
name = "fig-schema"
url = "https://github.com/diaryx-org/fig-schema"
# `master`, not the default `main`: repos.figl is where that fact is stated for
# the org, and this is the second place it has to be true.
release_branch = "master"

# What to run before cutting. Each repo owns its own CI; this names it.
verify = "cargo xtask ci"

# No `tag_starts`: nothing runs on the tag. This repository has only `ci.yml`, so
# the tag cuts the GitHub release and nothing more, and `cargo publish` is a
# separate command somebody runs deliberately.
